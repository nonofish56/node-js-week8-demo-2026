# W8 課堂 demo 資料庫（PostgreSQL）
# 只起一顆資料庫，app 在本機跑——跟本週作業 repo（livefit/school）同一套做法；
# 把 app 也裝進 Docker 是 W10 部署週的主題。
# port 5434：不跟作業的 livefit(5432)、school(5433) 打架。

services:
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=student
      - POSTGRES_PASSWORD=student666
      - POSTGRES_DB=livefit_demo
      - TZ=Asia/Taipei
      - PGTZ=Asia/Taipei
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d livefit_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgData:
