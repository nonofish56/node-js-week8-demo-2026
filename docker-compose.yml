# W8 課堂 demo 資料庫（PostgreSQL）
# 只起一顆資料庫，app 在本機跑——week5 README 的「localhost 開發伺服器」模式；
# app 也裝進 Docker 的完整版是 W10 部署週的主題。
# port 5434：不跟作業的 livefit(5432)、school(5433) 打架。

services:
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
      - TZ=Asia/Taipei
      - PGTZ=Asia/Taipei
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgData:
