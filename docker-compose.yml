volumes:
  pgDemoData:

services:
  # W8 課堂 demo 資料庫（PostgreSQL）
  # 你不需要懂這個檔案——它是電器，插電就用，原理 W10 會教
  # port 用 5434：不跟作業的 livefit(5432)、school(5433) 打架
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=student
      - POSTGRES_PASSWORD=student666
      - POSTGRES_DB=livefit_demo
      - TZ=Asia/Taipei
      - PGTZ=Asia/Taipei
    volumes:
      - pgDemoData:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d livefit_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
