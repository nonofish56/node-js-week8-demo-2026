# 課堂用的 PostgreSQL：只起資料庫，你的 Express 在本機跑
# port 5434：跟作業的 livefit(5432)、school(5433) 分開，可以同時開

services:
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
      - TZ=Asia/Taipei
      - PGTZ=Asia/Taipei
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgData:
